workflows:
  ios-ad-hoc-workflow:
    name: EasyBuy iOS Build Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
        - pattern: 'master'
    scripts:
      - name: Initialize local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Installing dependencies
        script: |
          flutter pub get
      - name: Building iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Package to true IPA structure
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Runner.ipa Payload
    artifacts:
      - build/ios/iphoneos/Runner.ipa
    publishing:
      email:
        recipients:
          - thomasabelt35@gmail.com
        notify:
          success: true
          failure: true
